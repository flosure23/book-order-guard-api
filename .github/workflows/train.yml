name: Train ML Model

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - "ml/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  pull_request:
    branches:
      - main
    paths:
      - "app/**"
      - "ml/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/train.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -q

  train:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify MLflow tracking secret
        run: |
          test -n "$MLFLOW_TRACKING_URI"

      - name: Train model
        run: |
          python -m ml.train

      - name: Verify trained model can be loaded
        env:
          MODEL_MODE: local
        run: |
          python -c "from app.model_loader import load_model, get_model_info; load_model(); print(get_model_info())"

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: trained-order-risk-model-files
          path: ml/artifacts